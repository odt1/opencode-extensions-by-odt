name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      # One install for every workspace; the lockfile at the root is the only one.
      - run: npm ci

      # typecheck + tests + rebuild every GUI bundle + fail if a committed bundle is stale
      - run: npm run check
