name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    # Windows is not decoration: npm runs scripts through cmd.exe there, and a
    # POSIX-only check would pass on Linux while making `npm run check` and
    # `npm publish` unusable on a Windows checkout.
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm

      # One install for every workspace; the lockfile at the root is the only one.
      - run: npm ci

      # typecheck + tests + rebuild every GUI bundle + fail if a committed bundle is stale
      - run: npm run check
